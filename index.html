<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manuais | Primeiros Socorros</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif;}
        html, body {
            width: 100%; min-height: 100vh;
            background: #050B18; color: #E0E7FF;
            overflow-x: hidden;
        }
        header {
            width: 100%; padding: 18px 5%;
            background: rgba(8, 14, 32, 0.9);
            border-bottom: 1px solid #121C33;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .botao-voltar {
            position: absolute; left: 5%;
            color: #FF4D4D; font-size: 22px; text-decoration: none;
        }
        h1 {font-family: 'Orbitron', sans-serif; font-size: 24px; color: #FF4D4D;}
        main {padding: 25px 5% 90px 5%;}
        .aviso {
            background: rgba(255, 77, 77, 0.1); border: 1px solid #FF4D4D;
            border-radius: 10px; padding: 14px; margin-bottom: 20px;
            text-align: center; font-weight: 500; color: #FF8080;
        }
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(8, 14, 32, 0.95); border-top: 1px solid #121C33;
            display: flex; justify-content: space-around; padding: 10px 0 16px;
            z-index: 10;
        }
        .nav-item {text-align: center; color: #607090; text-decoration: none; font-size: 11px;}
        .nav-item.ativo {color: #FF4D4D;}
        .nav-item .icone {display: block; font-size: 22px; margin-bottom: 3px;}
    </style>
</head>
<body>

<header>
    <a href="index.html" class="botao-voltar">←</a>
    <h1>📚 MANUAIS</h1>
</header>

<div class="aviso">
    ⚠️ EM CASO DE EMERGÊNCIA GRAVE, LIGUE 192!
</div>

<main>
    <h2>Conteúdo em construção</h2>
    <p>Aqui você vai adicionar os livros, guias e materiais de primeiros socorros.</p>
</main>

<nav>
    <a href="index.html" class="nav-item">
        <div class="icone">🏠</div>
        INÍCIO
    </a>
    <a href="#" class="nav-item ativo">
        <div class="icone">📚</div>
        GUIAS
    </a>
    <a href="#" class="nav-item">
        <div class="icone">ℹ️</div>
        AJUDA
    </a>
    <a href="#" class="nav-item">
        <div class="icone">⚙️</div>
        MAIS
    </a>
</nav>

</body>
</html>
